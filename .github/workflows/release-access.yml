name: Check TestFlight prerequisites
on:
  push:
    branches: [codex/release-access]
  workflow_dispatch:
permissions: {}
jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testflight
    steps:
      - name: Check credential binding presence without reading or printing values
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set +x
          missing=0
          printf '## TestFlight binding presence\n\nPresence does not establish validity or signing authority. No credential values were inspected or printed.\n\n' >> "$GITHUB_STEP_SUMMARY"
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_P8_BASE64 APPLE_TEAM_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APP_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64; do
            if [[ -n "${!name:-}" ]]; then
              printf -- '- `%s`: configured\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            else
              printf -- '- `%s`: missing\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              printf 'Missing required binding: %s\n' "$name"
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then
            echo '::error::TestFlight signing/API setup is incomplete. Configure the missing bindings securely in the testflight Actions environment; do not paste values into chat.'
            exit 1
          fi
          echo 'Required bindings are present; validity still requires the release pipeline.'
