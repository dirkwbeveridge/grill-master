name: Web regression tests

on:
  pull_request:
  push:
    branches: [main, codex/app-store-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
