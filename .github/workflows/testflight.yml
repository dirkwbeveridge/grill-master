name: TestFlight release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'New monotonically increasing Apple build number (integer)'
        required: true
        type: string
      whats_new:
        description: 'TestFlight What to Test (en-US)'
        required: true
        type: string
        default: 'Validate cooking timers, background reminders, Live Activities, and iPhone/iPad layouts.'
permissions:
  contents: read
concurrency:
  group: testflight-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed stable Xcode with an iOS SDK
        run: python3 scripts/release/select-xcode.py >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Gate release with unsigned simulator build and native captures
        run: bash scripts/release/validate-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: testflight-native-screenshots
          path: native-screenshots/
          if-no-files-found: error
          retention-days: 14
  upload:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 50
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed stable Xcode with an iOS SDK
        run: python3 scripts/release/select-xcode.py >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Archive, upload, verify App Store Connect, and set What to Test
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          TESTFLIGHT_WHATS_NEW: ${{ inputs.whats_new }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: bash scripts/release/testflight.sh
