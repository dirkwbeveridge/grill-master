name: Export native simulator captures

on:
  push:
    branches: [codex/native-capture-export]
    paths:
      - '.github/workflows/export-native-captures.yml'
      - 'scripts/release/export-native-captures.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: export-native-screenshots
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main as the clean output base
        uses: actions/checkout@v5
        with:
          ref: main
          path: output-repository
          persist-credentials: true
      - name: Check out the reviewed exporter from the triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: exporter
          persist-credentials: false
      - name: Verify the native source run and commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            let run;
            try {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: 41384119053,
              });
              run = response.data;
            } catch {
              core.setFailed('Source verification request failed; check Actions read permission and source-run availability.');
              return;
            }
            const expectedRepository = 'dirkwbeveridge/grill-master';
            const checks = [
              ['workflow repository', `${context.repo.owner}/${context.repo.repo}` === expectedRepository],
              ['source repository', run.repository?.full_name === expectedRepository],
              ['source head repository', run.head_repository?.full_name === expectedRepository],
              ['source commit', run.head_sha === 'cb52b374bd21963bf390f5917cfa2cb2520bb0cc'],
              ['source completion', run.status === 'completed'],
              ['source success', run.conclusion === 'success'],
              ['source workflow path', run.path?.split('@')[0] === '.github/workflows/ios-validate.yml'],
            ];
            const failed = checks.filter(([, passed]) => !passed).map(([label]) => label);
            if (failed.length) {
              core.setFailed(`Source verification failed: ${failed.join(', ')}.`);
              return;
            }
            core.notice('Source verification passed: successful native source run, repository, workflow, and commit match.');
      - name: Refuse an existing output branch
        working-directory: output-repository
        shell: bash
        run: |
          set -Eeuo pipefail
          stage='output branch preflight'
          trap 'failure_status=$?; printf "::error title=Native capture export::%s failed (exit %s).\n" "$stage" "$failure_status" >&2' ERR
          if git ls-remote --exit-code --heads origin refs/heads/codex/native-screenshots; then
            echo '::error title=Native capture export::Output branch already exists; refusing to modify it.' >&2
            exit 1
          else
            branch_status=$?
            if [[ "$branch_status" != 2 ]]; then
              echo '::error title=Native capture export::Output branch preflight could not determine remote branch availability.' >&2
              exit "$branch_status"
            fi
          fi
          echo '::notice title=Native capture export::Output branch preflight passed: no existing screenshot branch.'
      - name: Download only the unsigned native screenshot artifact
        id: download_captures
        uses: actions/download-artifact@v4
        with:
          name: native-ios-screenshots
          run-id: 41384119053
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-capture-input
      - name: Report artifact download result
        if: ${{ always() && (steps.download_captures.outcome == 'success' || steps.download_captures.outcome == 'failure') }}
        shell: bash
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download_captures.outcome }}
        run: |
          set -Eeuo pipefail
          stage='artifact download result'
          trap 'failure_status=$?; printf "::error title=Native capture export::%s failed (exit %s).\n" "$stage" "$failure_status" >&2' ERR
          if [[ "$DOWNLOAD_OUTCOME" == success ]]; then
            echo '::notice title=Native capture export::Download passed: requested native screenshot artifact is available for validation.'
          else
            echo '::error title=Native capture export::Native screenshot artifact download failed; no files were exported.' >&2
            exit 1
          fi
      - name: Test the offline artifact validator
        shell: bash
        run: |
          set -Eeuo pipefail
          stage='offline validator self-test'
          trap 'failure_status=$?; printf "::error title=Native capture export::%s failed (exit %s).\n" "$stage" "$failure_status" >&2' ERR
          python3 exporter/scripts/release/export-native-captures.py --self-test
          echo '::notice title=Native capture export::Offline validator self-tests passed.'
      - name: Validate and export the allowlisted native evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          stage='artifact validation and export'
          trap 'failure_status=$?; printf "::error title=Native capture export::%s failed (exit %s).\n" "$stage" "$failure_status" >&2' ERR
          python3 exporter/scripts/release/export-native-captures.py \
            --source "$RUNNER_TEMP/native-capture-input" \
            --output "$GITHUB_WORKSPACE/output-repository/release/native-screenshots"
      - name: Commit screenshots on a new output branch and push without force
        working-directory: output-repository
        shell: bash
        run: |
          set -Eeuo pipefail
          stage='creating output branch'
          trap 'failure_status=$?; printf "::error title=Native capture export::%s failed (exit %s).\n" "$stage" "$failure_status" >&2' ERR
          git switch --create codex/native-screenshots
          stage='staging native evidence'
          # These allowlisted captures are intentional release evidence, even
          # though the general generated-screenshot directory is ignored.
          git add --force -- release/native-screenshots
          stage='validating staged paths'
          python3 - <<'PY'
          import subprocess
          expected = {
              f'release/native-screenshots/{name}' for name in (
                  'iphone-configure.png', 'iphone-temperatures.png',
                  'ipad-configure.png', 'ipad-temperatures.png',
                  'capture-manifest.json', 'README.md',
              )
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          ).decode().strip('\0').split('\0'))
          if actual != expected:
              raise SystemExit('Refusing to commit unexpected or missing paths.')
          PY
          stage='committing native evidence'
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Preserve native iPhone and iPad simulator captures'
          echo '::notice title=Native capture export::Commit passed: only the six expected native evidence files were committed on the new output branch.'
          stage='checking output branch before push'
          if git ls-remote --exit-code --heads origin refs/heads/codex/native-screenshots; then
            echo '::error title=Native capture export::Output branch appeared during export; refusing to modify it.' >&2
            exit 1
          else
            branch_status=$?
            if [[ "$branch_status" != 2 ]]; then
              echo '::error title=Native capture export::Could not determine output branch availability before push.' >&2
              exit "$branch_status"
            fi
          fi
          stage='pushing native evidence'
          git push origin HEAD:refs/heads/codex/native-screenshots
          echo '::notice title=Native capture export::Push passed: new native screenshot branch published without force.'
          stage='writing run summary'
          {
            echo '## Native simulator evidence exported'
            echo
            echo 'Output branch: `codex/native-screenshots` (main was not changed).'
            echo 'Files: four native PNGs, capture-manifest.json, and provenance README.'
            echo 'Source run: https://github.com/dirkwbeveridge/grill-master/actions/runs/41384119053'
            echo 'Source commit: `cb52b374bd21963bf390f5917cfa2cb2520bb0cc`.'
            echo
            echo 'Open all four images for visual acceptance before using them in App Store review.'
          } >> "$GITHUB_STEP_SUMMARY"
